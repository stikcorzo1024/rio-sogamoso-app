name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            lld

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip wheel setuptools
          pip install cython==0.29.36
          pip install buildozer

      - name: Compilar APK
        run: |
          # Limpiar builds anteriores
          rm -rf .buildozer bin

          # Compilar con timeout extendido
          yes | timeout 45m buildozer android debug 2>&1 | tee build.log || true

          # Verificar si se generó el APK
          if ls bin/*.apk 1> /dev/null 2>&1; then
            echo "APK generado exitosamente"
            ls -la bin/
          else
            echo "Error: No se generó el APK"
            echo "=== Últimos errores del log ==="
            grep -i "error\|exception\|failed" build.log | tail -50
            exit 1
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: RioSogamoso-APK
          path: bin/*.apk
          retention-days: 30

      - name: Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
