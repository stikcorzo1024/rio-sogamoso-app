name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            zlib1g-dev \
            autoconf \
            libtool \
            cmake \
            lld \
            ccache \
            pkg-config

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          # Usar Cython 3.x que es compatible con Python 3.11+
          pip install "cython>=3.0,<4.0" buildozer python-for-android

      - name: Build APK
        run: |
          # Configurar entorno
          export ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk
          export ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r25b

          # Ejecutar build con salida detallada
          buildozer -v android debug 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "=== BUILD EXIT CODE: $BUILD_EXIT_CODE ==="
          echo ""

          # Mostrar últimas líneas del log si falla
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "=== ÚLTIMAS 100 LÍNEAS DEL LOG ==="
            tail -100 build.log
          fi

      - name: Check build result
        run: |
          echo "=== Buscando APK en todo el proyecto ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"

          echo ""
          echo "=== Contenido de bin/ ==="
          ls -la bin/ 2>/dev/null || echo "bin/ directory not found"

          echo ""
          echo "=== Contenido de .buildozer ==="
          ls -la .buildozer/android/platform/build-arm64-v8a/dists/*/build/outputs/apk/debug/ 2>/dev/null || echo "Build outputs not found"

          # Copiar APK si existe en otra ubicación
          APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "APK encontrado en: $APK_PATH"
            mkdir -p bin
            cp "$APK_PATH" bin/riosogamoso-debug.apk
            ls -la bin/
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RioSogamoso-APK
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/dists/*/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload full buildozer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-full-log
          path: .buildozer/logs/
          if-no-files-found: ignore
