name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            lld \
            openjdk-17-jdk \
            patch \
            unzip \
            zip \
            zlib1g-dev \
            autoconf \
            libtool

          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Build APK
        env:
          ANDROIDSDK: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Check APK
        run: |
          echo "=== Checking for APK ==="
          find . -name "*.apk" -type f
          ls -la bin/ || echo "bin folder not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RioSogamoso-APK
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
