name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:  # Permite ejecutar manualmente

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Instalar Buildozer y dependencias Python
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Aceptar licencias Android SDK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true

      - name: Compilar APK
        run: |
          # Limpiar builds anteriores si existen
          rm -rf .buildozer bin

          # Aceptar licencias automáticamente
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk

          # Compilar (yes para aceptar cualquier prompt)
          yes | buildozer android debug 2>&1 | tee build.log

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RioSogamoso-APK
          path: bin/*.apk
          retention-days: 30

      - name: Subir log de compilación (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
